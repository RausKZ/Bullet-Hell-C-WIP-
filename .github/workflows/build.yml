name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Compilar contra una glibc antigua para que funcione en mas distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de compilacion (solo cabeceras, no hacen falta para jugar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Compilar
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Librerias dinamicas que necesita el binario
        run: readelf -d build/BulletHell | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: BulletHell-linux
          path: build/BulletHell

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          cmake -B build
          cmake --build build --config Release --parallel

      - uses: ilammy/msvc-dev-cmd@v1

      - name: DLLs que necesita el ejecutable
        run: dumpbin /dependents build\Release\BulletHell.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BulletHell-windows
          path: build/Release/BulletHell.exe
